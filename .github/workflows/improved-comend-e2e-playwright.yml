name: E2E (playwright, push-driven)

on:
  push:
    branches: [playwright]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      WEB_URL: https://comend-git-playwright-comend.vercel.app
      PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY }}
      GIT_SHA: ${{ github.sha }}
      NODE_ENV: test
      E2E: "1"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_VERCEL_DEPLOYMENT_SUFFIX: vercel.app

    steps:
      - name: 📝 Dump full GitHub event payload
        run: |
          echo "=== Dumping $GITHUB_EVENT_PATH ==="
          cat "$GITHUB_EVENT_PATH" | jq .

      - name: 👀 Checkout repository at deployment SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_SHA }}

      - name: 🧱 Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ⏬ Install dependencies
        run: npm ci

      - name: ✅ Check Vercel env
        run: |
          test -n "${VERCEL_TOKEN:-}" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "${VERCEL_PROJECT_ID:-}" || (echo "Missing VERCEL_PROJECT_ID" && exit 1)
          test -n "${VERCEL_ORG_ID:-}" || (echo "Missing VERCEL_ORG_ID" && exit 1)

      # 🔎 Poll the Vercel API for an existing deployment of this commit/branch (no new deploys)
      - name: 🔎 Wait for existing Vercel deployment (commit or branch)
        id: wait_deploy
        shell: bash
        env:
          TOKEN: ${{ env.VERCEL_TOKEN }}
          PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          ORG_ID: ${{ env.VERCEL_ORG_ID }}   # team or user id (team_xxx / user_xxx)
          SHA: ${{ env.GIT_SHA }}
        run: |
          set -euo pipefail
          base="https://api.vercel.com/v13/deployments"
          qs="projectId=${PROJECT_ID}&target=preview&limit=50"
          # scope to team if provided
          if [ -n "${ORG_ID:-}" ]; then qs="${qs}&teamId=${ORG_ID}"; fi
          
          url=""
          state=""
          
          for i in {1..36}; do
            # Try by commit SHA
            resp=$(curl -sS -H "Authorization: Bearer ${TOKEN}" "${base}?${qs}&meta-githubCommitSha=${SHA}" || true)
            url=$(echo "$resp" | jq -r '(.deployments // []) | map(select(.readyState!="CANCELED")) | sort_by(.created) | last | .url // empty')
            state=$(echo "$resp" | jq -r '(.deployments // []) | map(select(.readyState!="CANCELED")) | sort_by(.created) | last | .readyState // empty')
          
            # Fallback by branch ref if none by SHA yet
            if [ -z "$url" ]; then
              resp=$(curl -sS -H "Authorization: Bearer ${TOKEN}" "${base}?${qs}&meta-githubCommitRef=playwright" || true)
              url=$(echo "$resp" | jq -r '(.deployments // []) | map(select(.readyState!="CANCELED")) | sort_by(.created) | last | .url // empty')
              state=$(echo "$resp" | jq -r '(.deployments // []) | map(select(.readyState!="CANCELED")) | sort_by(.created) | last | .readyState // empty')
            fi
          
            if [ -n "$url" ] && [ "$state" = "READY" ]; then
              break
            fi
          
            echo "Waiting for existing deployment… attempt $i state=${state:-<none>}"
            sleep 5
          done
          
          if [ -n "$url" ]; then
            [[ "$url" != http* ]] && url="https://${url}"
            echo "Found deployment: $url (state=$state)"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "No deployment located in time; will skip dynamic wait and rely on alias."
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      # ⏳ Wait on that specific deployment URL only if we found one
      - name: ⏳ Wait for DEPLOY_URL to respond (with debug + bypass)
        if: ${{ steps.wait_deploy.outputs.url != '' }}
        shell: bash
        env:
          URL: ${{ steps.wait_deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          echo "Probing deploy URL: ${URL:-<empty>}"
          for i in {1..36}; do
            CODE=$(curl -s -o /tmp/dbody -D /tmp/dheaders -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              -H "x-vercel-set-bypass-cookie: true" \
              -c /tmp/dcookies -b /tmp/dcookies \
              -L "$URL" || true)
            echo "Attempt $i (deploy URL) -> HTTP $CODE"
            if echo "$CODE" | grep -Eq '^(200|301|302|307|308)$'; then
              echo "Deploy URL is reachable."; exit 0
            fi
            head -n 20 /tmp/dheaders || true
            head -c 200 /tmp/dbody || true; echo
            sleep 5
          done
          echo "Deploy URL not reachable in time."; cat /tmp/dheaders || true; exit 1

      - name: 💧 Rehydrate SSL certs to /tmp
        shell: bash
        env:
          CLIENT_CERT_BASE64: ${{ secrets.CLIENT_CERT_BASE64 }}
          CLIENT_KEY_BASE64: ${{ secrets.CLIENT_KEY_BASE64 }}
          SERVER_CA_BASE64: ${{ secrets.SERVER_CA_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CLIENT_CERT_BASE64" | base64 -d > /tmp/client-cert.pem
          echo "$CLIENT_KEY_BASE64"  | base64 -d > /tmp/client-key.pem
          echo "$SERVER_CA_BASE64"   | base64 -d > /tmp/server-ca.pem
          chmod 600 /tmp/client-key.pem /tmp/client-cert.pem /tmp/server-ca.pem
          ls -l /tmp/client-*.pem /tmp/server-ca.pem

      - name: ⏬ Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 🔐 Check encryption key presence
        run: |
          if [ -z "${PRISMA_FIELD_ENCRYPTION_KEY:-}" ]; then
            echo "PRISMA_FIELD_ENCRYPTION_KEY is missing"; exit 1
          else
            echo "PRISMA_FIELD_ENCRYPTION_KEY is set ✅"
          fi

      - name: 🦆 Apply Prisma migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: 🔎 Check Vercel slugs
        run: |
          echo "VERCEL_PROJECT_SLUG=${{ vars.VERCEL_PROJECT_SLUG || '<missing>' }}"
          echo "VERCEL_TEAM_SLUG=${{ vars.VERCEL_TEAM_SLUG || '<missing>' }}"

      - name: ⏳ Wait for WEB_URL to respond (with debug + bypass)
        shell: bash
        env:
          URL: ${{ env.WEB_URL }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          echo "Probing (alias): ${URL:-<empty>}"
          if [ -z "${URL:-}" ]; then
            echo "ERROR: WEB_URL is empty. Dumping event:"; cat "$GITHUB_EVENT_PATH"; exit 1
          fi
          for i in {1..36}; do
            CODE=$(curl -s -o /tmp/pbody -D /tmp/pheaders -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              -H "x-vercel-set-bypass-cookie: true" \
              -c /tmp/pcookies -b /tmp/pcookies \
              -L "$URL" || true)
            echo "Attempt $i (alias) -> HTTP $CODE"
            if echo "$CODE" | grep -Eq '^(200|301|302|307|308)$'; then
              echo "Playwright alias is reachable."; exit 0
            fi
            head -n 20 /tmp/pheaders || true
            head -c 200 /tmp/pbody || true; echo
            sleep 5
          done
          echo "Alias not reachable in time."; cat /tmp/pheaders || true; exit 1

      - name: 🏃 Run Playwright E2E
        run: npx playwright test

      - name: ⏫ Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: ⏫ Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results
          retention-days: 7
