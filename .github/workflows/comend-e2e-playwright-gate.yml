name: E2E Gate (Vercel Playwright)

on:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: write   # needed to fire repository_dispatch
  actions: read
  pull-requests: read

jobs:
  route:
    # SAME gate logic as before
    if: |
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'vercel.deployment.success' &&
      github.event.client_payload.environment == 'preview' &&
      (
        github.event.client_payload.git.branch == 'playwright' ||
        github.event.client_payload.git.ref == 'playwright'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Trigger E2E Runner via repository_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'e2e.playwright',
              client_payload: {
                web_url: 'https://comend-git-playwright-comend.vercel.app',
                git_sha: '${{ github.event.client_payload.git.sha || github.sha }}'
              }
            });
