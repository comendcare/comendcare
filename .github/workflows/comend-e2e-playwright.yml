name: E2E (Vercel Preview, event-driven)

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to test against"
        required: true
      git_sha:
        description: "Commit SHA to checkout"
        required: false
      branch_name:
        description: "Branch name to build Vercel alias URL"
        required: false


permissions:
  contents: read
  actions: read

# Kill older runs for the same commit
concurrency:
  group: e2e-${{ github.event.client_payload.git.sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    env:
      # From Vercel dispatch payload
      PREVIEW_URL: ${{ github.event.client_payload.url || github.event.inputs.preview_url }}
      PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY }}
      GIT_SHA: ${{ github.event.client_payload.git.sha || github.event.inputs.git_sha || github.sha }}

      # Your Playwright matrix reads per-app URLs from env
      WEB_URL: ${{ github.event.client_payload.url || github.event.inputs.preview_url }}

      # Safer test mode
      NODE_ENV: test
      E2E: "1"

      # Needed by your app/tests
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}

      # Protection Bypass (use the value generated in Vercel > Project Settings)
      # Store the SAME value in GitHub as a repo/org secret.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # If your middleware normalizes preview subdomains
      NEXT_PUBLIC_VERCEL_DEPLOYMENT_SUFFIX: vercel.app

    steps:
      - name: Checkout repository at deployment SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_SHA }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rehydrate SSL certs to /tmp
        shell: bash
        env:
          CLIENT_CERT_BASE64: ${{ secrets.CLIENT_CERT_BASE64 }}
          CLIENT_KEY_BASE64: ${{ secrets.CLIENT_KEY_BASE64 }}
          SERVER_CA_BASE64: ${{ secrets.SERVER_CA_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CLIENT_CERT_BASE64" | base64 -d > /tmp/client-cert.pem
          echo "$CLIENT_KEY_BASE64"   | base64 -d > /tmp/client-key.pem
          echo "$SERVER_CA_BASE64"    | base64 -d > /tmp/server-ca.pem
          chmod 600 /tmp/client-key.pem /tmp/client-cert.pem /tmp/server-ca.pem
          ls -l /tmp/client-*.pem /tmp/server-ca.pem

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 🔐 Check encryption key presence
        run: |
          if [ -z "${PRISMA_FIELD_ENCRYPTION_KEY:-}" ]; then
            echo "PRISMA_FIELD_ENCRYPTION_KEY is missing"; exit 1
          else
            echo "PRISMA_FIELD_ENCRYPTION_KEY is set ✅"
          fi

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: 🔎 Check Vercel slugs
        run: |
          echo "VERCEL_PROJECT_SLUG=${{ vars.VERCEL_PROJECT_SLUG || '<missing>' }}"
          echo "VERCEL_TEAM_SLUG=${{ vars.VERCEL_TEAM_SLUG || '<missing>' }}"

      - name: 🔧 Compute WEB_URL from branch alias (fallback to PREVIEW_URL)
        shell: bash
        env:
          # Try to get the branch from the Vercel dispatch; for manual runs you can add an input too.
          RAW_BRANCH: ${{ github.event.client_payload.git.branch || github.event.inputs.branch_name }}
          PROJECT: ${{ vars.VERCEL_PROJECT_SLUG }}
          TEAM: ${{ vars.VERCEL_TEAM_SLUG }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          set -euo pipefail
          BRANCH="${RAW_BRANCH:-}"
          if [ -n "$BRANCH" ] && [ -n "${PROJECT:-}" ] && [ -n "${TEAM:-}" ]; then
            # Vercel normalizes branch: lower-case, non-alnum -> '-', trim dashes
            SLUG="$(printf "%s" "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
            URL="https://${PROJECT}-git-${SLUG}-${TEAM}.vercel.app"
            echo "WEB_URL=$URL" >> "$GITHUB_ENV"
            echo "Using branch alias URL: $URL"
          else
            echo "WEB_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"
            echo "Branch or slugs missing; falling back to PREVIEW_URL: ${PREVIEW_URL:-<empty>}"
          fi

      - name: ⏳ Wait for WEB_URL to respond (with debug + bypass)
        shell: bash
        env:
          URL: ${{ env.WEB_URL }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          echo "Probing: ${URL:-<empty>}"
          if [ -z "${URL:-}" ]; then
            echo "ERROR: WEB_URL is empty. Dumping event:"; cat "$GITHUB_EVENT_PATH"; exit 1
          fi
          for i in {1..36}; do
            CODE=$(curl -s -o /tmp/pbody -D /tmp/pheaders -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              -H "x-vercel-set-bypass-cookie: true" \
              -c /tmp/pcookies -b /tmp/pcookies \
              -L "$URL" || true)
            echo "Attempt $i -> HTTP $CODE"
            if echo "$CODE" | grep -Eq '^(200|301|302|307|308)$'; then
              echo "Preview is reachable."; exit 0
            fi
            head -n 20 /tmp/pheaders || true
            head -c 200 /tmp/pbody || true; echo
            sleep 5
          done
          echo "Preview not reachable in time."; cat /tmp/pheaders || true; exit 1

      - name: 🏃 Run Playwright E2E
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results
          retention-days: 7
