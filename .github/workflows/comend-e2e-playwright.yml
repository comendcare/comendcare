name: E2E (Vercel Preview, event-driven)

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to test against"
        required: true
      git_sha:
        description: "Commit SHA to checkout"
        required: false

permissions:
  contents: read
  actions: read

# Kill older runs for the same commit
concurrency:
  group: e2e-${{ github.event.client_payload.git.sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    env:
      # From Vercel dispatch payload
      PREVIEW_URL: ${{ github.event.client_payload.url || github.event.inputs.preview_url }}
      GIT_SHA: ${{ github.event.client_payload.git.sha || github.event.inputs.git_sha || github.sha }}

      # Your Playwright matrix reads per-app URLs from env
      WEB_URL: ${{ github.event.client_payload.url || github.event.inputs.preview_url }}

      # Safer test mode
      NODE_ENV: test
      E2E: "1"

      # Needed by your app/tests
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}

      # Protection Bypass (use the value generated in Vercel > Project Settings)
      # Store the SAME value in GitHub as a repo/org secret.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # If your middleware normalizes preview subdomains
      NEXT_PUBLIC_VERCEL_DEPLOYMENT_SUFFIX: vercel.app

    steps:
      - name: Checkout repository at deployment SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_SHA }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rehydrate SSL certs to /tmp
        shell: bash
        env:
          CLIENT_CERT_BASE64: ${{ secrets.CLIENT_CERT_BASE64 }}
          CLIENT_KEY_BASE64: ${{ secrets.CLIENT_KEY_BASE64 }}
          SERVER_CA_BASE64: ${{ secrets.SERVER_CA_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CLIENT_CERT_BASE64" | base64 -d > /tmp/client-cert.pem
          echo "$CLIENT_KEY_BASE64"   | base64 -d > /tmp/client-key.pem
          echo "$SERVER_CA_BASE64"    | base64 -d > /tmp/server-ca.pem
          chmod 600 /tmp/client-key.pem /tmp/client-cert.pem /tmp/server-ca.pem
          ls -l /tmp/client-*.pem /tmp/server-ca.pem

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npx prisma migrate deploy

      # Small probe so we fail fast if preview isn’t reachable
      - name: Wait for Preview URL to respond (with debug + bypass)
        shell: bash
        env:
          URL: ${{ env.PREVIEW_URL }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          
          echo "Preview URL: ${URL:-<empty>}"
          if [ -z "${URL:-}" ]; then
            echo "ERROR: PREVIEW_URL is empty. Dumping incoming event for debugging:"
            cat "$GITHUB_EVENT_PATH"
            exit 1
          fi
          
          echo "Resolving host…"
          getent hosts "$(printf "%s" "$URL" | sed -E 's#https?://([^/]+)/?.*#\1#')" || true
          
          # Try up to ~3 minutes
          for i in {1..36}; do
            # Hit with bypass header, follow redirects, keep cookie jar
            CODE=$(curl -s -o /tmp/pbody -D /tmp/pheaders -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              -c /tmp/pcookies -b /tmp/pcookies \
              -L "$URL" || true)
          
            echo "Attempt $i -> HTTP $CODE"
            # Accept 200 and common redirect codes (301/302/307/308)
            if echo "$CODE" | grep -Eq '^(200|301|302|307|308)$'; then
              echo "Preview is reachable."
              exit 0
            fi
          
            # Print a tiny snippet to help debug (don’t spam logs)
            echo "---- response headers ----"
            head -n 20 /tmp/pheaders || true
            echo "---- body (first 200 chars) ----"
            head -c 200 /tmp/pbody || true
            echo
            sleep 5
          done
          
          echo "Preview not reachable in time."
          echo "Final headers:"; cat /tmp/pheaders || true
          exit 1

      - name: Run Playwright E2E (monorepo matrix)
        run: |
          echo "Testing against $WEB_URL"
          npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload traces/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results
          retention-days: 7
