# .github/workflows/pr-tests.yml
name: "Unit Tests - PR"

on:
  pull_request:
    branches:
      - main
      - preview
      - development

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npx jest --passWithNoTests --coverage
        env:
          CI: true