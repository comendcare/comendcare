name: "PR Tests"

on:
  pull_request:
    branches:
      - main
      - preview
      - development

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    env:
      CI: true
      # NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.19.0"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npx jest --passWithNoTests --coverage --collectCoverageFrom "packages/**/*.ts" --maxWorkers=2