name: "PR Tests"

on:
  pull_request:
    branches:
      - main
      - preview
      - development

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Tests (ESM)
        run: npx node --loader ts-node/esm --experimental-vm-modules node_modules/jest/bin/jest.js --passWithNoTests --coverage